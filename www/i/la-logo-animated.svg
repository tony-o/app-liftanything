<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<style>
  .la-letter{ animation: la-letter-wave 3.6s ease-in-out infinite; }
  .la-letter.l1{ animation-delay: 0s; }
  .la-letter.l2{ animation-delay: .18s; }
  @keyframes la-letter-wave{
    0%,20%,100%{ transform: translateY(0); }
    8%{ transform: translateY(-8px); }
  }
  .la-underline{ animation: la-bar-slide 2.2s ease-in-out infinite; }
  @keyframes la-bar-slide{
    0%{ width:0; x:50; }
    35%{ width:56; x:22; }
    65%{ width:56; x:22; }
    100%{ width:0; x:78; }
  }
</style>
<text class="la-letter l1" x="38" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="48" fill="#141b41">L</text>
<text class="la-letter l2" x="64" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="48" fill="#141b41">A</text>
<rect class="la-underline" x="50" y="72" width="0" height="7" fill="#06d6a0"/>
</svg>
