<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LiftAnything</title>
<link rel="icon" type="image/svg+xml" href="/i/la-logo-static.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:var(--font-body);
    background:#e4e6e9;
    color:#16181d;
    -webkit-font-smoothing:antialiased;
  }
  input,select,button{font-family:inherit;color:inherit;}
  button{cursor:pointer;background:none;border:none;}
  input:focus,button:focus,select:focus{outline:none;}
  ::-webkit-scrollbar{width:0;height:0;}

  :root{
    --font-header:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-body:'Figtree',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --bg:#f5f6f7;
    --surface:#ffffff;
    --surface-2:#eef0f2;
    --surface-3:#e4e7ea;
    --border:#e1e4e8;
    --text:#16181d;
    --text-dim:#4b5563;
    --text-faint:#6b7280;
    --accent:#06d6a0;
    --accent-ink:#063d2e;
    --accent-text:#141b41;
    --quad:#2fa78d;
    --ham:#b8960a;
    --push:#2b3570;
    --pull:#ff6978;
    --danger:#e6394f;
    --r-lg:0;
    --r-md:0;
    --r-sm:0;
    --keyboard-inset:0px;
  }

  [data-theme="dark"]{
    --bg:#16181d;
    --surface:#1e2128;
    --surface-2:#262a33;
    --surface-3:#2f333d;
    --border:#333844;
    --text:#f0f1f3;
    --text-dim:#b8bcc4;
    --text-faint:#7d8290;
    --accent-text:#8891f5;
  }
  [data-theme="dark"] body{color:var(--text);}
  [data-theme="dark"] .tabbar{background:rgba(30,33,40,.9);}

  body{background:var(--bg);}

  .app{
    display:flex;flex-direction:column;
    height:100vh;max-width:480px;margin:0 auto;
    background:var(--bg);
    position:relative;
  }

  .topbar{
    flex:0 0 auto;
    padding:22px 22px 14px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
  }
  .eyebrow{
    font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--text-faint);text-transform:uppercase;margin-bottom:2px;
    font-family:var(--font-header);
  }
  .eyebrow.auth-eyebrow{font-size:18px;font-weight:900;color:var(--text);}
  .topbar .title-block h1{font-size:26px;font-weight:800;letter-spacing:-.01em;font-family:var(--font-header);}
  .topbar .title-block{display:flex;align-items:center;gap:8px;}
  .topbar-logo{width:20px;height:20px;flex:0 0 auto;}
  .topbar-logo svg{width:100%;height:100%;overflow:visible;display:block;}
  .topbar .action-slot{display:flex;align-items:center;gap:8px;}

  .screen{
    flex:1 1 auto;
    overflow-y:auto;
    padding:4px 22px 100px;
  }

  .tabbar{
    flex:0 0 auto;
    display:flex;
    padding:10px 18px calc(14px + env(safe-area-inset-bottom,0px));
    gap:6px;
    background:rgba(245,246,247,.9);
    border-top:1px solid var(--border);
    backdrop-filter:blur(10px);
  }
  .tab-btn{
    flex:1;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:8px 4px 6px;
    border-radius:0;
    color:var(--text-faint);
    transition:color .15s ease;
  }
  svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:block;}
  .tab-btn svg{width:22px;height:22px;}
  .ex-chev svg{width:13px;height:13px;}
  .picker-group-chev svg{width:12px;height:12px;}
  .tab-btn span{font-size:10.5px;font-weight:700;letter-spacing:.02em;font-family:var(--font-header);}
  .tab-btn.active{color:var(--accent-text);}

  /* ---------- shared components ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:0;
    padding:16px;
  }
  .tagged{border-left:4px solid var(--tagc,var(--border));}

  .tag-quad{--tagc:var(--quad);}
  .tag-ham{--tagc:var(--ham);}
  .tag-push{--tagc:var(--push);}
  .tag-pull{--tagc:var(--pull);}

  .chip{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--surface-2);
    border:1px solid var(--border);
    padding:4px 10px 4px 8px;
    border-radius:0;
    font-size:11.5px;font-weight:600;color:var(--text-dim);
    white-space:nowrap;
    font-family:var(--font-header);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--tagc,var(--text-faint));flex:0 0 auto;}

  .btn-primary{
    background:var(--accent);color:var(--accent-ink);
    font-weight:800;font-size:14.5px;
    padding:14px 18px;border-radius:0;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .1s ease;
    font-family:var(--font-header);
  }
  .btn-primary:active{transform:scale(.97);}
  .full{width:100%;}
  .btn-primary.small{padding:9px 16px;font-size:13px;border-radius:0;}
  .btn-primary[disabled]{opacity:.35;pointer-events:none;}

  .btn-ghost{
    background:var(--surface-2);color:var(--text);
    border:1px solid var(--border);
    font-weight:700;font-size:13.5px;
    padding:13px 18px;border-radius:0;
    font-family:var(--font-header);
  }
  .btn-ghost.small{padding:9px 14px;font-size:12.5px;border-radius:0;}
  .btn-ghost:active{background:var(--surface-3);}

  .btn-danger{color:var(--danger);}

  .icon-btn{
    width:30px;height:30px;border-radius:0;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-faint);font-size:15px;
    background:transparent;
  }
  .icon-btn:active{background:var(--surface-3);}

  .section-label{
    font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--text-faint);margin:22px 2px 10px;
    font-family:var(--font-header);
  }
  .section-label:first-child{margin-top:6px;}

  .empty-note{
    color:var(--text-dim);font-size:13.5px;line-height:1.5;
    padding:18px 2px;
  }

  /* ---------- HISTORY ---------- */
  .stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px;}
  .stat-tile{
    background:var(--surface);border:1px solid var(--border);border-radius:0;
    padding:14px 10px;text-align:center;
  }
  .stat-tile .num{font-size:20px;font-weight:800;color:var(--accent-text);letter-spacing:-.01em;font-family:var(--font-header);}
  .stat-tile .lbl{font-size:10px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-top:3px;}


  .date-header{
    position:sticky;top:-4px;z-index:5;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--bg);
    padding:10px 2px 8px;
    margin-bottom:8px;
    border-bottom:1px solid var(--border);
  }
  .date-header-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);font-family:var(--font-header);}
  .date-header-stats{font-size:12px;font-weight:700;color:var(--text-faint);white-space:nowrap;}

  .feed-card{margin-bottom:12px;}
  .feed-card:active{background:var(--surface-2);}
  .feed-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .avatar{
    width:36px;height:36px;flex:0 0 auto;color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:800;
  }
  .feed-name{font-size:13.5px;font-weight:700;font-family:var(--font-header);}
  .you-badge{
    display:inline-block;background:var(--surface-2);color:var(--text-dim);
    font-size:10px;font-weight:800;padding:2px 6px;margin-left:4px;text-transform:uppercase;letter-spacing:.03em;
  }
  .feed-time{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
  .feed-body{padding:12px;background:var(--surface-2);margin-bottom:10px;}
  .feed-title{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:800;margin-bottom:4px;font-family:var(--font-header);}
  .feed-stats{font-size:12px;color:var(--text-dim);}
  .feed-actions{display:flex;}
  .kudos-btn{
    display:flex;align-items:center;gap:6px;
    font-size:12.5px;font-weight:700;color:var(--text-dim);
    padding:6px 4px;
  }
  .kudos-btn svg{stroke:var(--text-faint);}
  .kudos-btn.liked{color:var(--danger);}
  .kudos-btn.liked svg{stroke:var(--danger);fill:var(--danger);}
  .feed-end{text-align:center;font-size:12px;font-weight:700;color:var(--text-faint);padding:18px 0 8px;}

  /* ---------- RECORD : start screen ---------- */
  .empty-cta{
    width:100%;display:flex;align-items:center;gap:14px;
    background:linear-gradient(135deg, var(--surface-2), var(--surface));
    border:1px solid var(--border);border-radius:0;
    padding:18px;margin-bottom:6px;text-align:left;
  }
  .empty-cta:active{transform:scale(.99);}
  .empty-cta-icon{
    width:44px;height:44px;border-radius:0;background:var(--accent);color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex:0 0 auto;
  }
  .empty-cta-title{font-size:15px;font-weight:800;font-family:var(--font-header);}
  .empty-cta-sub{font-size:12.5px;color:var(--text-dim);margin-top:2px;}

  .tmpl-mini{
    display:flex;align-items:center;gap:12px;
    padding:14px;margin-bottom:10px;border-radius:0;
  }
  .tmpl-mini-info{flex:1;min-width:0;}
  .tmpl-mini-name{font-size:14px;font-weight:700;font-family:var(--font-header);}
  .tmpl-mini-sub{font-size:11.5px;color:var(--text-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---------- RECORD : active session ---------- */
  .session-bar{padding:2px 2px 16px;}
  .session-name-input{
    display:block;
    background:transparent;border:none;font-size:20px;font-weight:800;
    width:100%;padding:0;margin-bottom:8px;
  }
  .session-meta-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .session-sub{font-size:12px;color:var(--text-dim);}
  .session-actions{display:flex;gap:8px;flex:0 0 auto;}

  .ex-card{border-radius:0;margin-bottom:12px;overflow:hidden;}
  .ex-head{
    display:flex;align-items:center;gap:10px;padding:14px 14px;
  }
  .ex-name{flex:1;font-size:14.5px;font-weight:700;font-family:var(--font-header);}
  .ex-progress{font-size:11px;color:var(--text-faint);font-weight:700;margin-right:2px;}
  .ex-chev{color:var(--text-faint);transition:transform .15s ease;font-size:13px;}
  .ex-card.collapsed .ex-chev{transform:rotate(-90deg);}
  .ex-card.collapsed .ex-body{display:none;}

  .last-time-line{
    font-size:11.5px;color:var(--text-faint);padding:0 14px 10px;margin-top:-4px;
  }
  .last-time-line b{color:var(--text-dim);font-weight:700;}

  .ex-body{padding:0 14px 14px;}
  .set-grid{
    display:grid;grid-template-columns:22px 1fr 1fr 26px;gap:8px;align-items:center;margin-bottom:8px;
  }
  .set-grid.time-based{grid-template-columns:22px 1fr 26px;}
  .set-grid.hd{color:var(--text-faint);font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;}
  .set-grid .set-num{text-align:center;font-size:12.5px;font-weight:700;color:var(--text-dim);}
  .set-grid input{
    width:100%;background:var(--surface-2);border:1px solid var(--border);
    border-radius:0;padding:9px 8px;font-size:13.5px;font-weight:600;text-align:center;
  }
  .set-grid input::-webkit-outer-spin-button,.set-grid input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .set-grid input[type=number]{-moz-appearance:textfield;}
  .set-x{color:var(--text-faint);font-size:15px;text-align:center;}
  .time-badge{display:inline-flex;vertical-align:middle;color:var(--text-faint);margin-left:2px;}
  .time-badge svg{width:12px;height:12px;}

  .add-set-btn{
    width:100%;padding:10px;border-radius:0;border:1px dashed var(--border);
    color:var(--text-dim);font-size:12.5px;font-weight:700;text-align:center;margin-top:2px;
  }
  .add-set-btn:active{background:var(--surface-2);}
  .remove-ex-btn{
    width:100%;padding:10px;border-radius:0;border:1px solid var(--danger);
    color:var(--danger);font-size:12.5px;font-weight:700;text-align:center;margin-top:8px;
  }
  .remove-ex-btn:active{background:rgba(230,57,79,.08);}

  .fab-add{
    width:100%;
    background:var(--surface-3);border:1px solid var(--border);
    color:var(--text);font-weight:800;font-size:13.5px;
    padding:15px;border-radius:0;margin-top:6px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .fab-add:active{background:var(--surface-2);}

  .free-note{
    font-size:12px;color:var(--text-faint);text-align:center;padding:14px 10px 4px;line-height:1.5;
  }

  /* ---------- WORKOUTS ---------- */
  .tmpl-card{
    display:flex;align-items:center;gap:12px;margin-bottom:10px;
  }
  .tmpl-card-info{flex:1;min-width:0;}
  .tmpl-card-name{font-size:14.5px;font-weight:700;font-family:var(--font-header);}
  .tmpl-card-sub{font-size:12px;color:var(--text-dim);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tmpl-card-count{font-size:11px;color:var(--text-faint);font-weight:700;margin-top:6px;}

  /* ---------- overlay + sheet ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,22,26,.4);opacity:0;pointer-events:none;
    transition:opacity .2s ease;z-index:20;
  }
  .overlay.open{opacity:1;pointer-events:auto;}

  .sheet{
    position:fixed;left:0;right:0;bottom:var(--keyboard-inset,0px);
    max-width:480px;margin:0 auto;
    max-height:min(82vh, var(--sheet-max-height, 82vh));
    background:var(--surface);
    border-top:1px solid var(--border);
    border-radius:0;
    transform:translateY(100%);
    transition:transform .25s cubic-bezier(.32,.72,0,1), bottom .2s ease, max-height .2s ease;
    z-index:21;
    display:flex;flex-direction:column;
    box-shadow:0 -12px 40px rgba(20,22,26,.12);
  }
  .sheet.open{transform:translateY(0);}
  .sheet-handle{width:38px;height:4px;background:var(--border);border-radius:0;margin:10px auto 4px;flex:0 0 auto;}
  .sheet-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 20px 14px;flex:0 0 auto;
  }
  .sheet-head h2{font-size:17px;font-weight:800;}
  .sheet-body{padding:0 20px 26px;overflow-y:auto;}

  .search-input{
    width:100%;background:var(--surface-2);border:1px solid var(--border);
    border-radius:0;padding:12px 14px;font-size:14px;margin-bottom:16px;
  }
  .search-input::placeholder{color:var(--text-faint);}

  .picker-group-label{
    display:flex;align-items:center;gap:6px;
    font-size:11px;font-weight:800;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;
    margin:14px 2px 8px;padding:4px 2px;
  }
  .picker-group-label .picker-group-name{flex:1;}
  .picker-group-count{font-size:10.5px;font-weight:700;color:var(--text-faint);}
  .picker-group-chev{color:var(--text-faint);transition:transform .15s ease;font-size:13px;display:inline-flex;}
  .picker-group-chev.collapsed{transform:rotate(-90deg);}
  .picker-group.highlight{ animation: picker-group-highlight 1.8s ease-out; }
  @keyframes picker-group-highlight{
    0%{ background:rgba(184,150,10,.35); }
    100%{ background:transparent; }
  }
  .picker-row{
    display:flex;align-items:center;gap:10px;
    padding:11px 4px;border-bottom:1px solid var(--border);
  }
  .picker-row:last-child{border-bottom:none;}
  .picker-row-name{flex:1;font-size:13.5px;font-weight:600;}
  .picker-add-btn{
    width:26px;height:26px;border-radius:0;background:var(--surface-2);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:15px;font-weight:700;
  }
  .picker-add-btn.added{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}

  .custom-row{
    display:flex;flex-direction:column;gap:8px;margin-top:16px;
  }
  .custom-row input,.custom-row select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:0;padding:11px 12px;font-size:13.5px;
  }
  .custom-row button{width:100%;}

  .field-label{font-size:11px;font-weight:800;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin:16px 2px 8px;font-family:var(--font-header);}
  .field-label:first-child{margin-top:0;}
  .switch-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px;background:var(--surface);border:1px solid var(--border);
  }
  .switch-row-label{font-size:14.5px;font-weight:400;color:var(--text);font-family:var(--font-header);}
  .select-input{
    background:var(--surface-2);border:1px solid var(--border);border-radius:0;
    padding:8px 10px;font-size:13.5px;font-weight:600;color:var(--text);
    font-family:var(--font-body);flex:0 0 auto;
  }
  .switch{position:relative;display:inline-flex;align-items:center;cursor:pointer;flex:0 0 auto;}
  .switch input{position:absolute;opacity:0;width:0;height:0;}
  .switch-track{
    position:relative;width:48px;height:28px;flex:0 0 auto;
    background:var(--surface-3);border:1px solid var(--border);
    transition:background .18s ease, border-color .18s ease;
  }
  .switch-thumb{
    position:absolute;top:2px;left:2px;width:22px;height:22px;
    background:#ffffff;border:1px solid var(--border);
    box-shadow:0 1px 2px rgba(20,24,29,.18);
    transition:transform .2s cubic-bezier(.4,0,.2,1), background .18s ease, border-color .18s ease;
  }
  .switch input:checked + .switch-track .switch-thumb{transform:translateX(20px);}
  .switch-accent input:checked + .switch-track{background:var(--accent);border-color:var(--accent);}

  /* ---------- AUTH ---------- */
  .auth-screen{
    display:none;
    min-height:100vh;align-items:center;justify-content:center;
    padding:24px;background:var(--bg);
  }
  .auth-card{width:100%;max-width:380px;}
  .auth-error{color:var(--danger);font-size:12.5px;font-weight:600;margin-top:14px;line-height:1.4;}
  .auth-toggle{display:flex;background:var(--surface-2);border:1px solid var(--border);margin-bottom:22px;}
  .auth-toggle button{flex:1;padding:11px;font-size:13px;font-weight:700;color:var(--text-dim);font-family:var(--font-header);}
  .auth-toggle button.active{background:var(--surface);color:var(--text);}
  .text-input{
    width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:0;
    padding:13px 14px;font-size:15px;font-weight:600;
  }
  .combo-wrap{position:relative;}
  .combo-dropdown{
    display:none;position:absolute;left:0;right:0;top:100%;z-index:5;
    background:var(--surface);border:1px solid var(--border);border-top:none;
    max-height:180px;overflow-y:auto;
  }
  .combo-option{padding:10px 12px;font-size:13.5px;font-weight:600;color:var(--text);}
  .combo-option:active{background:var(--surface-2);}

  .editor-ex-row{
    display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--border);
  }
  .editor-ex-row:last-child{border-bottom:none;}
  .editor-ex-row .dot{flex:0 0 auto;}
  .editor-ex-row .nm{flex:1;font-size:13.5px;font-weight:600;}

  .sess-ex-row{
    display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--border);
  }
  .sess-ex-row:last-child{border-bottom:none;}
  .sess-ex-name{font-size:14px;font-weight:700;font-family:var(--font-header);}
  .sess-ex-sub{font-size:12px;color:var(--text-dim);margin-top:3px;}

  .toast{
    position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);
    background:var(--text);border:1px solid var(--text);color:var(--bg);
    font-size:13px;font-weight:700;padding:12px 18px;border-radius:0;
    opacity:0;pointer-events:none;transition:all .25s ease;z-index:30;
    box-shadow:0 10px 30px rgba(20,22,26,.2);
    display:flex;align-items:center;gap:8px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="app" id="app-root" style="display:none;">
  <div class="topbar" id="topbar"></div>
  <div class="screen" id="screen"></div>
  <div class="tabbar" id="tabbar"></div>
</div>
<div class="auth-screen" id="auth-screen"></div>
<div class="overlay" id="overlay" data-click="close_sheet"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head" id="sheet-head"></div>
  <div class="sheet-body" id="sheet-body"></div>
</div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script>
/* ---------------- data ---------------- */
const TAG_COLORS = { quad:'#2fa78d', 'hamstring/glute':'#b8960a', push:'#2b3570', pull:'#ff6978' };
const PALETTE = ['#2fa78d','#b8960a','#141b41','#ff6978','#e6394f','#5c6bc0','#0f7a63','#d1477c','#3a8fae','#8a6fd1'];
function norm_tag(tag){ return (tag||'').trim().toLowerCase(); }
function tag_label(tag){ return (tag||'').trim() || 'General'; }
function hash_str(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))|0; } return Math.abs(h); }
function tag_color(tag){
  const key = norm_tag(tag);
  if(TAG_COLORS[key]) return TAG_COLORS[key];
  return PALETTE[hash_str(key)%PALETTE.length];
}
const DEFAULT_CATEGORIES = ['Quad','Hamstring/Glute','Push','Pull','Core','Cardio'];
function all_known_categories(){
  const seen = new Map();
  DEFAULT_CATEGORIES.forEach(c=>{ const k=norm_tag(c); if(!seen.has(k)) seen.set(k, c); });
  state.library.forEach(e=>{ const k=norm_tag(e.category); if(!seen.has(k)) seen.set(k, tag_label(e.category)); });
  state.templates.forEach(t=>{ const k=norm_tag(t.category); if(!seen.has(k)) seen.set(k, tag_label(t.category)); });
  return Array.from(seen.values());
}
function group_library(filter_q){
  const map = new Map();
  state.library.forEach(e=>{
    if(filter_q && !e.name.toLowerCase().includes(filter_q)) return;
    const key = norm_tag(e.category);
    if(!map.has(key)) map.set(key, {label:tag_label(e.category), items:[]});
    map.get(key).items.push(e);
  });
  return map;
}
function group_templates(){
  const map = new Map();
  state.templates.forEach(t=>{
    const key = norm_tag(t.category);
    if(!map.has(key)) map.set(key, {label:tag_label(t.category), items:[]});
    map.get(key).items.push(t);
  });
  if(state.workout_sort_order==='alphabetical'){
    const entries = Array.from(map.entries()).sort((a,b)=>a[1].label.localeCompare(b[1].label));
    entries.forEach(([,g])=>g.items.sort((a,b)=>a.name.localeCompare(b.name)));
    return new Map(entries);
  }
  return map;
}
function toggle_template_group(key){
  if(state.template_group_collapsed.has(key)) state.template_group_collapsed.delete(key);
  else state.template_group_collapsed.add(key);
  render();
}

function load_time_based_ids(){
  try{ return new Set(JSON.parse(localStorage.getItem('time_based_exercise_ids')||'[]')); }
  catch(e){ return new Set(); }
}
function persist_time_based_ids(){
  localStorage.setItem('time_based_exercise_ids', JSON.stringify([...state.time_based_ids]));
}
function is_time_based(exercise_id){
  return state.time_based_ids.has(exercise_id);
}
// Once the backend round-trips a real `time_based` flag on library/session
// exercises, this picks it up automatically — until then, the localStorage
// cache from add_custom_exercise() is the only source for it.
function merge_time_based_flags(list){
  let changed = false;
  (list||[]).forEach(e=>{
    if(!e || !e.time_based) return;
    const id = e.id!=null ? e.id : e.exercise_id;
    if(id!=null && !state.time_based_ids.has(id)){ state.time_based_ids.add(id); changed=true; }
  });
  if(changed) persist_time_based_ids();
}

const state = {
  tab:'motivation',
  templates:[],
  library:[],
  active_session:null,
  template_draft:null,
  editing_template_id:undefined,
  picker_context:null,
  picker_filter:'',
  picker_expanded:new Set(),
  picker_highlight_category:null,
  time_based_ids: load_time_based_ids(),
  custom_ex_time_based:false,
  template_group_collapsed:new Set(),
  session_source_id:null,
  units:'imperial',
  hide_default_exercises:false,
  workout_sort_order:'created',
  dark_mode: localStorage.getItem('dark_mode')==='true',
  logged_in:false,
  auth_mode:'login',
  auth_fields:{name:'', email:'', password:''},
  user:null,
  session_checked:false,
  feed:{
    motivation:{items:[], page:0, exhausted:false},
    mylog:{items:[], page:0, exhausted:false},
  },
};

function rel_time(d){
  const diff_days = Math.floor((new Date()-d)/86400000);
  if(diff_days<=0) return 'Today';
  if(diff_days===1) return 'Yesterday';
  if(diff_days<7) return diff_days+'d ago';
  return fmt_date_long(d);
}
function avatar_color(name){ return PALETTE[hash_str(norm_tag(name))%PALETTE.length]; }
function normalize_session(sess){ return {...sess, date:new Date(sess.date)}; }
function find_session_by_id(id){
  return state.feed.motivation.items.find(h=>h.id===id) || state.feed.mylog.items.find(h=>h.id===id);
}

/* ---------------- feed pagination / infinite scroll ---------------- */
const FEED_PAGE_SIZE = 10;
function reset_feed_paging(kind){ state.feed[kind] = {items:[], page:0, exhausted:false, loading:false}; }
async function load_feed_page(kind){
  const st = state.feed[kind];
  if(st.exhausted || st.loading) return 0;
  st.loading = true;
  let items;
  try{
    items = kind==='motivation' ? await liftanything.get_feed(st.page+1) : await liftanything.get_my_sessions(st.page+1);
  } catch(e){
    st.loading = false;
    show_toast('Failed to load sessions');
    return 0;
  }
  items = (items||[]).map(normalize_session);
  items.forEach(it=>merge_time_based_flags(it.exercises));
  st.items = st.items.concat(items);
  st.page++;
  st.loading = false;
  if(items.length<FEED_PAGE_SIZE) st.exhausted = true;
  return items.length;
}
async function ensure_feed_filled(kind){
  reset_feed_paging(kind);
  await load_feed_page(kind);
  render();
  const el = document.getElementById('screen');
  while(el.scrollHeight<=el.clientHeight+4 && !state.feed[kind].exhausted){
    await load_feed_page(kind);
    render();
  }
  if(!state.feed[kind].exhausted){
    await load_feed_page(kind);
    render();
  }
}
async function handle_feed_scroll(){
  const kind = state.tab;
  if(kind!=='motivation' && kind!=='mylog') return;
  const st = state.feed[kind];
  if(!st || st.exhausted || st.loading) return;
  const el = document.getElementById('screen');
  if(el.scrollTop + el.clientHeight >= el.scrollHeight - 80){
    const saved_top = el.scrollTop;
    await load_feed_page(kind);
    render();
    el.scrollTop = saved_top;
  }
}
function sync_cached_kudos(id, kudos, liked){
  ['motivation','mylog'].forEach(kind=>{
    const cached = state.feed[kind].items.find(x=>x.id===id);
    if(cached){ cached.kudos = kudos; cached.liked = liked; }
  });
}
async function toggle_kudos(id){
  const obj = find_session_by_id(id);
  if(!obj) return;
  const prev = {kudos:obj.kudos, liked:obj.liked};
  const optimistic_liked = !obj.liked;
  sync_cached_kudos(id, obj.kudos + (optimistic_liked?1:-1), optimistic_liked);
  render();
  try{
    const res = await liftanything.toggle_kudos(id);
    sync_cached_kudos(id, res.kudos, res.liked);
  } catch(e){
    sync_cached_kudos(id, prev.kudos, prev.liked);
    show_toast('Failed to update kudos');
  }
  render();
}

/* ---------------- helpers ---------------- */
function fmt(n){ return Math.round(n).toLocaleString('en-US'); }
function unit_label(){ return state.units==='metric' ? 'kg' : 'lb'; }
function to_display_weight(lb){ return state.units==='metric' ? Math.round(lb*0.453592*10)/10 : lb; }
function to_stored_weight(w){ return state.units==='metric' ? Math.round((w/0.453592)*100)/100 : w; }
function fmt_date_pieces(d){
  return { dow:['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()], day:String(d.getDate()).padStart(2,'0') };
}
function fmt_date_long(d){
  return d.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
}
function fmt_time_of_day(d){
  return d.toLocaleTimeString('en-US',{hour:'numeric', minute:'2-digit'});
}
function session_volume(sess){
  let v=0;
  sess.exercises.forEach(e=>{
    if(is_time_based(e.exercise_id)) return; // seconds aren't weight — don't fold them into lb totals
    e.sets.forEach(st=>{ const w=parseFloat(st.weight)||0, r=parseFloat(st.reps)||0; v+=w*r; });
  });
  return v;
}
function session_set_count(sess){
  return sess.exercises.reduce((a,e)=>a+e.sets.length,0);
}
function icon(name){
  const paths = {
    history:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
    record:'<rect x="4" y="10" width="3" height="4" rx="1"/><rect x="17" y="10" width="3" height="4" rx="1"/><rect x="7" y="8" width="2.4" height="8" rx="1"/><rect x="14.6" y="8" width="2.4" height="8" rx="1"/><line x1="9.4" y1="12" x2="14.6" y2="12"/>',
    workouts:'<line x1="5" y1="7" x2="19" y2="7"/><line x1="5" y1="12" x2="19" y2="12"/><line x1="5" y1="17" x2="13" y2="17"/>',
    plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    chev:'<path d="M9 6l6 6-6 6"/>',
    heart:'<path d="M12 20s-7-4.4-9.5-9A5.3 5.3 0 0112 6.5 5.3 5.3 0 0121.5 11c-2.5 4.6-9.5 9-9.5 9z"/>',
    gear:'<circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.4M12 18.6V21M21 12h-2.4M5.4 12H3M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7M18.4 18.4l-1.7-1.7M7.3 7.3L5.6 5.6"/>',
  };
  return `<svg viewBox="0 0 24 24">${paths[name]||''}</svg>`;
}

/* ---------------- event wiring (no inline handlers / no eval) ---------------- */
function data_args(arr){ return JSON.stringify(arr).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
function read_args(el){ return el.dataset.args ? JSON.parse(el.dataset.args) : []; }
function dispatch(el, action, extra_args){
  const fn = window[action];
  if(typeof fn !== 'function') return;
  fn(...read_args(el), ...extra_args);
}
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-click]');
  if(!el) return;
  if(el.dataset.stop) e.stopPropagation();
  dispatch(el, el.dataset.click, []);
});
document.addEventListener('input', e=>{
  const el = e.target.closest('[data-input]');
  if(!el) return;
  const val = el.dataset.valueProp==='checked' ? el.checked : el.value;
  dispatch(el, el.dataset.input, [val]);
});
document.addEventListener('change', e=>{
  const el = e.target.closest('[data-change]');
  if(!el) return;
  const val = el.dataset.valueProp==='checked' ? el.checked : el.value;
  dispatch(el, el.dataset.change, [val]);
});

function setup_category_combo(input_id, dropdown_id, on_change){
  const input_el = document.getElementById(input_id);
  const dropdown_el = document.getElementById(dropdown_id);
  if(!input_el || !dropdown_el) return;
  const render_suggestions = ()=>{
    const q = input_el.value.trim().toLowerCase();
    const matches = all_known_categories().filter(c=>c.toLowerCase().includes(q));
    if(!matches.length){ dropdown_el.style.display='none'; dropdown_el.innerHTML=''; return; }
    dropdown_el.innerHTML = matches.map(c=>`<div class="combo-option">${c}</div>`).join('');
    dropdown_el.style.display='block';
  };
  input_el.addEventListener('focus', render_suggestions);
  input_el.addEventListener('input', ()=>{ render_suggestions(); on_change && on_change(input_el.value); });
  input_el.addEventListener('blur', ()=>{ setTimeout(()=>{ dropdown_el.style.display='none'; }, 150); });
  dropdown_el.addEventListener('pointerdown', e=>{
    const opt = e.target.closest('.combo-option');
    if(!opt) return;
    e.preventDefault();
    input_el.value = opt.textContent;
    dropdown_el.style.display='none';
    on_change && on_change(input_el.value);
  });
}

let toast_timer=null;
function show_toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toast_timer);
  toast_timer=setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------------- render root ---------------- */
function render(){
  if(!state.session_checked){
    document.getElementById('app-root').style.display='none';
    const auth_el = document.getElementById('auth-screen');
    auth_el.style.display='flex';
    auth_el.innerHTML = `<div class="eyebrow auth-eyebrow">LiftAnything</div>`;
    return;
  }
  if(!state.logged_in){
    document.getElementById('app-root').style.display='none';
    const auth_el = document.getElementById('auth-screen');
    auth_el.style.display='flex';
    auth_el.innerHTML = render_auth_screen();
    return;
  }
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('app-root').style.display='flex';
  render_topbar();
  render_tabbar();
  const el = document.getElementById('screen');
  if(state.tab==='motivation') el.innerHTML = render_motivation_screen();
  else if(state.tab==='mylog') el.innerHTML = render_my_log_screen();
  else if(state.tab==='record') el.innerHTML = render_record_screen();
  else if(state.tab==='workouts') el.innerHTML = render_workouts_screen();
  else el.innerHTML = render_settings_screen();
}

function render_auth_screen(){
  const is_login = state.auth_mode==='login';
  return `<div class="auth-card">
    <div class="eyebrow auth-eyebrow" style="margin-bottom:20px;">LiftAnything</div>
    <div class="auth-toggle">
      <button class="${is_login?'active':''}" data-click="set_auth_mode" data-args="${data_args(['login'])}">Log In</button>
      <button class="${!is_login?'active':''}" data-click="set_auth_mode" data-args="${data_args(['register'])}">Sign Up</button>
    </div>
    ${is_login?'':`<div class="field-label">Name</div><input class="text-input" value="${state.auth_fields.name}" autocapitalize="words" data-input="set_auth_field" data-args="${data_args(['name'])}" placeholder="Your name">`}
    <div class="field-label">Email</div>
    <input class="text-input" value="${state.auth_fields.email}" data-input="set_auth_field" data-args="${data_args(['email'])}" placeholder="you@example.com">
    <div class="field-label">Password</div>
    <input class="text-input" type="password" value="${state.auth_fields.password}" data-input="set_auth_field" data-args="${data_args(['password'])}" placeholder="••••••••">
    ${state.auth_error ? `<div class="auth-error">${state.auth_error}</div>` : ''}
    <button class="btn-primary full" style="margin-top:20px;" ${state.auth_submitting?'disabled':''} data-click="submit_auth">${state.auth_submitting?'Please wait…':(is_login?'Log In':'Create Account')}</button>
  </div>`;
}
function set_auth_field(key, val){ state.auth_fields[key] = val; }
function error_message(e, fallback){
  if(typeof e === 'string') return e;
  if(e && typeof e.message === 'string') return e.message;
  return fallback || 'Something went wrong. Try again.';
}
function set_auth_mode(m){ state.auth_mode=m; state.auth_error=null; render(); }
async function submit_auth(){
  if(state.auth_submitting) return;
  const is_login = state.auth_mode==='login';
  const email = state.auth_fields.email.trim();
  const password = state.auth_fields.password;
  const name = state.auth_fields.name.trim();
  state.auth_error = null;
  state.auth_submitting = true;
  render();
  try{
    const user = is_login
      ? await liftanything.login(email, password)
      : await liftanything.register(name, email, password);
    state.user = user;
    state.logged_in = true;
    state.auth_submitting = false;
    state.auth_fields = {name:'', email:'', password:''};
    render();
    await load_initial_data();
    ensure_feed_filled(state.tab==='mylog' ? 'mylog' : 'motivation');
    ensure_feed_filled(state.tab==='mylog' ? 'motivation' : 'mylog'); // stat row (motivation) + "last time" history (mylog) both needed regardless of active tab
  } catch(e){
    state.auth_submitting = false;
    state.auth_error = error_message(e);
    render();
  }
}

function set_tab(t){
  state.tab=t;
  if(t==='motivation' || t==='mylog') ensure_feed_filled(t);
  else render();
}

function render_tabbar(){
  const tabs=[['motivation','Motivation','heart'],['record','Record','record'],['workouts','Workouts','workouts'],['mylog','Me','history'],['settings','Settings','gear']];
  document.getElementById('tabbar').innerHTML = tabs.map(([id,label,ic])=>`
    <button class="tab-btn ${state.tab===id?'active':''}" data-click="set_tab" data-args="${data_args([id])}">
      ${icon(ic)}<span>${label}</span>
    </button>`).join('');
}

function topbar_logo_svg(){
  return `<svg viewBox="0 0 100 100">
    <style>
      .la-letter{ animation: la-letter-wave 3.6s ease-in-out infinite; }
      .la-letter.l1{ animation-delay: 0s; }
      .la-letter.l2{ animation-delay: .18s; }
      @keyframes la-letter-wave{
        0%,20%,100%{ transform: translateY(0); }
        8%{ transform: translateY(-8px); }
      }
      .la-underline{ animation: la-bar-slide 2.2s ease-in-out infinite; }
      @keyframes la-bar-slide{
        0%{ width:0; x:50; }
        35%{ width:56; x:22; }
        65%{ width:56; x:22; }
        100%{ width:0; x:78; }
      }
    </style>
    <text class="la-letter l1" x="38" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="48" fill="#141b41">L</text>
    <text class="la-letter l2" x="64" y="60" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="48" fill="#141b41">A</text>
    <rect class="la-underline" x="50" y="72" width="0" height="7" fill="#06d6a0"/>
  </svg>`;
}
function render_topbar(){
  const el = document.getElementById('topbar');
  const logo = `<div class="topbar-logo">${topbar_logo_svg()}</div>`;
  if(state.tab==='record' && state.active_session){
    el.innerHTML = `<div class="title-block">${logo}<div class="eyebrow">Session in progress</div></div>`;
  } else {
    el.innerHTML = `<div class="title-block">${logo}<div class="eyebrow">LiftAnything</div></div>`;
  }
}

/* ================= MOTIVATION FEED / HISTORY ================= */
function render_stat_row(kind){
  const feed = state.feed[kind].items;
  const now = new Date();
  const is_today = h => h.date.toDateString() === now.toDateString();
  const today_sessions = feed.filter(is_today);
  const week_sessions = feed.filter(h => (now-h.date)/86400000 <= 7);
  const today_volume = today_sessions.reduce((a,h)=>a+session_volume(h),0);
  const week_volume = week_sessions.reduce((a,h)=>a+session_volume(h),0);
  const unit_lbl = unit_label()==='kg'?'Kg':'Lb';
  return `<div class="stat-row">
    <div class="stat-tile">
      <div class="num">${fmt(to_display_weight(today_volume))} / ${today_sessions.length}</div>
      <div class="lbl">${unit_lbl} / Sessions Today</div>
    </div>
    <div class="stat-tile">
      <div class="num">${fmt(to_display_weight(week_volume))} / ${week_sessions.length}</div>
      <div class="lbl">${unit_lbl} / Sessions This Week</div>
    </div>
  </div>`;
}
function group_feed_by_date(items){
  const groups = [];
  let current = null;
  items.forEach(h=>{
    const key = h.date.toDateString();
    if(!current || current.key!==key){
      current = {key, date:h.date, items:[]};
      groups.push(current);
    }
    current.items.push(h);
  });
  return groups;
}
function render_feed_card(h){
  return `<div class="feed-card card" data-click="open_history_detail" data-args="${data_args([h.id])}">
      <div class="feed-head">
        <div class="avatar" style="background:${avatar_color(h.author_name)}">${h.author_initials}</div>
        <div class="feed-who">
          <div class="feed-name">${h.author_name}${h.mine?' <span class="you-badge">You</span>':''}</div>
          <div class="feed-time">${fmt_time_of_day(h.date)}</div>
        </div>
      </div>
      <div class="feed-body">
        <div class="feed-title"><span class="dot" style="--tagc:${tag_color(h.category)}"></span>${h.name}</div>
        <div class="feed-stats">${h.exercises.length} exercises · ${session_set_count(h)} sets · ${fmt(to_display_weight(session_volume(h)))} ${unit_label()}</div>
      </div>
      <div class="feed-actions">
        <button class="kudos-btn ${h.liked?'liked':''}" data-click="toggle_kudos" data-args="${data_args([h.id])}" data-stop="1">${icon('heart')}<span>${h.kudos}</span></button>
      </div>
    </div>`;
}
function render_date_header(group){
  const volume = group.items.reduce((a,h)=>a+session_volume(h),0);
  const count = group.items.length;
  return `<div class="date-header">
      <span class="date-header-label">${rel_time(group.date)}</span>
      <span class="date-header-stats">${fmt(to_display_weight(volume))} ${unit_label()} · ${count} session${count!==1?'s':''}</span>
    </div>`;
}
function render_feed_list(kind){
  const st = state.feed[kind];
  const items = st.items;
  if(!items.length){
    return `<div class="empty-note">No sessions logged yet. Head to the Record tab to start your first workout.</div>`;
  }
  const sections = group_feed_by_date(items).map(group=>
    render_date_header(group) + group.items.map(render_feed_card).join('')
  ).join('');

function find_last_time_sets(exercise_id){
  const tb = is_time_based(exercise_id);
  let best = null;
  state.feed.mylog.items.forEach(s=>{
    const ex = s.exercises.find(e=>e.exercise_id===exercise_id);
    const done_sets = ex ? ex.sets.filter(st=>set_is_done(st, tb)) : [];
    if(done_sets.length && (!best || s.date>best.date)) best = {date:s.date, sets:done_sets};
  });
  return best ? best.sets : null;
}
function format_last_time_sets(sets, time_based){
  return sets.map(st=>{
    if(time_based) return `<b>${parseFloat(st.weight)}s</b>`;
    const w = to_display_weight(parseFloat(st.weight));
    return `<b>${isNaN(w)?'BW':fmt(w)}×${st.reps}</b>`;
  }).join(' · ');
}

function render_active_session(){
  const sess = state.active_session;
  const mins = Math.max(0, Math.round((new Date()-sess.started_at)/60000));

  const ex_cards = sess.exercises.map((e,i)=>{
    const tb = is_time_based(e.exercise_id);
    const done_ct = e.sets.filter(st=>set_is_done(st, tb)).length;
    const last_sets = find_last_time_sets(e.exercise_id);
    const rows = e.sets.map((st,j)=>tb ? `
      <div class="set-grid time-based">
        <div class="set-num">${j+1}</div>
        <input type="number" inputmode="numeric" placeholder="seconds" value="${st.weight}" data-input="update_set" data-args="${data_args([i,j,'weight'])}">
        <div class="set-x" data-click="remove_set" data-args="${data_args([i,j])}">✕</div>
      </div>` : `
      <div class="set-grid">
        <div class="set-num">${j+1}</div>
        <input type="number" inputmode="decimal" placeholder="${unit_label()}" value="${st.weight}" data-input="update_set" data-args="${data_args([i,j,'weight'])}">
        <input type="number" inputmode="numeric" placeholder="reps" value="${st.reps}" data-input="update_set" data-args="${data_args([i,j,'reps'])}">
        <div class="set-x" data-click="remove_set" data-args="${data_args([i,j])}">✕</div>
      </div>`).join('');

    return `<div class="ex-card card tagged ${e.expanded?'':'collapsed'}" style="--tagc:${tag_color(e.category)}">
      <div class="ex-head" data-click="toggle_expand" data-args="${data_args([i])}">
        <span class="dot" style="--tagc:${tag_color(e.category)}"></span>
        <div class="ex-name">${e.name}${tb?` <span class="time-badge" title="Time-based">${icon('history')}</span>`:''}</div>
        <div class="ex-progress">${done_ct}/${e.sets.length}</div>
        <div class="ex-chev">${icon('chev')}</div>
      </div>
      ${last_sets ? `<div class="last-time-line">Last time: ${format_last_time_sets(last_sets, tb)}</div>` : ''}
      <div class="ex-body">
        <div class="set-grid hd ${tb?'time-based':''}"><div></div><div>${tb?'Seconds':'Weight'}</div>${tb?'':'<div>Reps</div>'}<div></div></div>
        ${rows}
        <button class="add-set-btn" data-click="add_set" data-args="${data_args([i])}">+ Add Set</button>
        <button class="remove-ex-btn" data-click="remove_exercise_from_session" data-args="${data_args([i])}">Remove Exercise</button>
      </div>
    </div>`;
  }).join('');

  return `
    <div class="session-bar">
      <input class="session-name-input" value="${sess.name}" placeholder="Name this session" autocapitalize="words" data-input="rename_session">
      <div class="session-meta-row">
        <div class="session-sub">Started ${mins} min ago</div>
        <div class="session-actions">
          <button class="btn-ghost small btn-danger" data-click="discard_session">Discard</button>
          <button class="btn-primary small" ${sess.saving?'disabled':''} data-click="finish_session">${sess.saving?'Saving…':'Finish'}</button>
        </div>
      </div>
    </div>
    ${ex_cards.length ? ex_cards : `<div class="empty-note">No exercises yet — add one below, or add sets whenever you get to them. Nothing here is required in order.</div>`}
    <button class="fab-add" data-click="open_exercise_picker" data-args="${data_args(['session'])}">${icon('plus')} Add Exercise</button>
    <div class="free-note">Skip anything, do it out of order, or add extra exercises mid-session — whatever matches what you actually did.</div>
  `;
}

function rename_session(v){ state.active_session.name=v; persist_active_session(); }
function toggle_expand(i){ state.active_session.exercises[i].expanded = !state.active_session.exercises[i].expanded; persist_active_session(); render(); }
function update_set(i,j,field,val){ state.active_session.exercises[i].sets[j][field]=val; persist_active_session(); }
function set_is_done(st, time_based){ return time_based ? String(st.weight).trim()!=='' : String(st.reps).trim()!==''; }
function add_set(i){
  const sets = state.active_session.exercises[i].sets;
  const last = sets[sets.length-1];
  sets.push({weight:last?last.weight:'', reps:last?last.reps:''});
  persist_active_session();
  render();
}
function remove_set(i,j){ state.active_session.exercises[i].sets.splice(j,1); persist_active_session(); render(); }
function remove_exercise_from_session(i){
  const ex = state.active_session.exercises[i];
  const has_data = ex.sets.some(st=>String(st.weight).trim()!=='' || String(st.reps).trim()!=='');
  if(has_data && !confirm(`Remove "${ex.name}"? You've already entered weight/reps for it.`)) return;
  state.active_session.exercises.splice(i,1);
  persist_active_session();
  render();
}

function discard_session(){ state.active_session=null; persist_active_session(); render(); show_toast('Session discarded'); }
function most_common_category(exercises){
  const counts = new Map();
  exercises.forEach(e=>{
    const key = e.category || 'General';
    counts.set(key, (counts.get(key)||0)+1);
  });
  let best = 'General', best_count = 0;
  exercises.forEach(e=>{
    const key = e.category || 'General';
    const c = counts.get(key);
    if(c > best_count){ best_count = c; best = key; }
  });
  return best;
}
async function finish_session(){
  const sess = state.active_session;
  if(sess.saving) return;
  const kept = sess.exercises.filter(e=>e.sets.some(st=>set_is_done(st, is_time_based(e.exercise_id))));
  if(!kept.length){ show_toast('Log at least one set first'); return; }
  const payload = {
    name: sess.name.trim() || 'Untitled Session',
    category: sess.source_id ? state.templates.find(t=>t.id===sess.source_id).category : most_common_category(kept),
    started_at: Math.floor(sess.started_at.getTime()/1000),
    exercises: kept.map(e=>{
      const tb = is_time_based(e.exercise_id);
      return {
        exercise_id:e.exercise_id, name:e.name, category:e.category,
        // time-based exercises store their duration (seconds) in the weight column, reps fixed at 1
        sets: e.sets.filter(st=>set_is_done(st, tb)).map(st=>tb ? {
          weight: parseFloat(st.weight),
          reps: 1,
        } : {
          weight: String(st.weight).trim()==='' ? null : to_stored_weight(parseFloat(st.weight)),
          reps: parseFloat(st.reps),
        }),
      };
    }),
  };
  sess.saving = true; render();
  try{
    await liftanything.create_session(payload);
  } catch(e){
    sess.saving = false; render();
    show_toast('Failed to save session: '+error_message(e));
    return;
  }
  state.active_session=null;
  persist_active_session();
  state.tab='mylog';
  reset_feed_paging('motivation');
  ensure_feed_filled('mylog');
  show_toast('Session saved');
}

  const category = d.category.trim() || 'General';
  const payload = {name:d.name.trim(), category, exercises:d.exercises.map(e=>({exercise_id:e.exercise_id, name:e.name, category:e.category}))};
  d.saving = true; render_template_editor_sheet();
  try{
    if(d.id){
      const updated = await liftanything.update_template(d.id, payload);
      const t = state.templates.find(x=>x.id===d.id);
      Object.assign(t, updated);
    } else {
      const created = await liftanything.create_template(payload);
      state.templates.push(created);
    }
  } catch(e){
    d.saving = false; render_template_editor_sheet();
    show_toast('Failed to save workout: '+error_message(e));
    return;
  }
  state.template_draft=null;
  close_sheet(); render(); show_toast('Workout saved');
}

/* ================= EXERCISE PICKER (shared) ================= */
function open_exercise_picker(context, extra){
  state.picker_context = context;
  state.picker_extra = extra;
  state.picker_filter = '';
  state.picker_expanded = new Set();
  state.custom_ex_time_based = false;
  render_picker_shell();
}
function current_picker_added_ids(){
  if(state.picker_context==='session') return state.active_session.exercises.map(e=>e.exercise_id);
  if(state.picker_context==='template_draft') return state.template_draft.exercises.map(e=>e.exercise_id);
  if(state.picker_context==='template_existing') return state.templates.find(t=>t.id===state.picker_extra).exercises.map(e=>e.exercise_id);
  return [];
}
function toggle_picker_category(key){
  if(state.picker_expanded.has(key)) state.picker_expanded.delete(key);
  else state.picker_expanded.add(key);
  render_picker_results();
}
function render_picker_shell(){
  open_sheet(
    `<h2>Add Exercise</h2><button class="icon-btn" data-click="finish_picking">✕</button>`,
    `<input id="picker-search-input" class="search-input" placeholder="Search exercises" value="${state.picker_filter}" data-input="set_picker_filter">
     <div id="picker-results"></div>
     <div class="field-label">Custom Exercise</div>
     <div class="custom-row">
       <input id="custom-ex-name" placeholder="Exercise name" autocapitalize="words">
       <div class="combo-wrap">
         <input id="custom-ex-category" placeholder="Pick existing or type a new category" autocapitalize="words">
         <div class="combo-dropdown" id="custom-ex-category-dropdown"></div>
       </div>
       <button class="btn-ghost small" data-click="add_custom_exercise">Add</button>
     </div>
     <div class="switch-row">
       <span class="switch-row-label">Time-based (track seconds, not weight)</span>
       <label class="switch switch-accent">
         <input id="custom-ex-time-based" type="checkbox" ${state.custom_ex_time_based?'checked':''} data-change="set_custom_ex_time_based_from_checkbox" data-value-prop="checked">
         <span class="switch-track"><span class="switch-thumb"></span></span>
       </label>
     </div>
     <button class="btn-primary full" style="margin-top:20px;" data-click="finish_picking">Done</button>`
  );
  setup_category_combo('custom-ex-category', 'custom-ex-category-dropdown');
  render_picker_results();
}
function render_picker_results(){
  const q = state.picker_filter.toLowerCase();
  const added = current_picker_added_ids();
  const group_map = group_library(q);
  const groups = Array.from(group_map.entries()).map(([key,g])=>{
    const expanded = q ? true : state.picker_expanded.has(key);
    const rows = expanded ? g.items.map(e=>`
      <div class="picker-row">
        <span class="dot" style="--tagc:${tag_color(e.category)}"></span>
        <div class="picker-row-name">${e.name}${is_time_based(e.id)?` <span class="time-badge" title="Time-based">${icon('history')}</span>`:''}</div>
        <button class="picker-add-btn ${added.includes(e.id)?'added':''}" data-click="pick_exercise" data-args="${data_args([e.id,e.name,e.category])}">${added.includes(e.id)?'✓':'+'}</button>
      </div>`).join('') : '';
    return `<div class="picker-group ${key===state.picker_highlight_category?'highlight':''}">
      <div class="picker-group-label" data-click="toggle_picker_category" data-args="${data_args([key])}">
        <span class="picker-group-chev ${expanded?'':'collapsed'}">${icon('chev')}</span>
        <span class="picker-group-name">${g.label}</span>
        <span class="picker-group-count">${g.items.length}</span>
      </div>
      ${rows}
    </div>`;
  }).join('');
  document.getElementById('picker-results').innerHTML = groups || '<div class="empty-note">No matches. Add it below as a custom exercise.</div>';
}
function set_picker_filter(val){ state.picker_filter=val; render_picker_results(); }
function pick_exercise(id, name, category){
  if(state.picker_context==='session'){
    if(state.active_session.exercises.some(e=>e.exercise_id===id)) return;
    const is_first = state.active_session.exercises.length===0;
    state.active_session.exercises.push({exercise_id:id, name, category, expanded:is_first, sets:[{weight:'',reps:''}]});
    persist_active_session();
  } else if(state.picker_context==='template_draft'){
    if(state.template_draft.exercises.some(e=>e.exercise_id===id)) return;
    state.template_draft.exercises.push({exercise_id:id, name, category});
  } else if(state.picker_context==='template_existing'){
    const t = state.templates.find(x=>x.id===state.picker_extra);
    if(t.exercises.some(e=>e.exercise_id===id)) return;
    t.exercises.push({exercise_id:id, name, category});
    persist_template(state.picker_extra);
  }
  render_picker_results();
}
function validate_exercise_field(label, val){
  if(val.trim().length < 3){ show_toast(`${label} must be at least 3 characters`); return false; }
  return true;
}
function set_custom_ex_time_based_from_checkbox(checked){ state.custom_ex_time_based = checked; }
async function add_custom_exercise(){
  const name_el = document.getElementById('custom-ex-name');
  const category_el = document.getElementById('custom-ex-category');
  const name = name_el.value.trim();
  if(!validate_exercise_field('Exercise name', name)) return;
  const category = category_el.value.trim() || 'General';
  if(!validate_exercise_field('Category', category)) return;
  const category_key = norm_tag(category);
  const time_based = state.custom_ex_time_based;
  let entry = state.library.find(e=>e.name.toLowerCase()===name.toLowerCase());
  if(!entry){
    try{
      entry = await liftanything.create_custom_exercise({name, category, time_based});
      if(!entry || !entry.id) throw new Error('Server did not return the created exercise');
      state.library.push(entry);
    } catch(e){
      show_toast('Failed to add exercise: '+error_message(e));
      return;
    }
  }
  if(time_based || entry.time_based){
    state.time_based_ids.add(entry.id);
    persist_time_based_ids();
  }
  state.picker_expanded.add(category_key);
  state.picker_highlight_category = category_key;
  pick_exercise(entry.id, entry.name, entry.category);
  setTimeout(()=>{
    if(state.picker_highlight_category===category_key){
      state.picker_highlight_category = null;
      render_picker_results();
    }
  }, 1800);
  name_el.value=''; category_el.value='';
  state.custom_ex_time_based = false;
  const time_based_el = document.getElementById('custom-ex-time-based');
  if(time_based_el) time_based_el.checked = false;
}
function finish_picking(){
  if(state.picker_context==='session'){ close_sheet(); render(); }
  else if(state.picker_context==='template_draft'){ render_template_editor_sheet(); }
  else if(state.picker_context==='template_existing'){ open_template_detail(state.picker_extra); }
  else close_sheet();
}

/* ================= sheet mechanics ================= */
function open_sheet(head_html, body_html){
  document.getElementById('sheet-head').innerHTML = head_html;
  document.getElementById('sheet-body').innerHTML = body_html;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}
function close_sheet(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
  render();
}

/* ================= boot ================= */
async function load_initial_data(){
  const [settings_r, templates_r, library_r] = await Promise.allSettled([
    liftanything.get_settings(),
    liftanything.get_templates(),
    liftanything.get_exercise_library(),
  ]);
  if(settings_r.status==='fulfilled' && settings_r.value){
    state.units = settings_r.value.units;
    state.hide_default_exercises = !!settings_r.value.hide_default_exercises;
    state.workout_sort_order = settings_r.value.workout_sort_order || 'created';
  } else show_toast('Failed to load settings');
  if(templates_r.status==='fulfilled') state.templates = templates_r.value || [];
  else show_toast('Failed to load workouts');
  if(library_r.status==='fulfilled') state.library = library_r.value || [];
  else show_toast('Failed to load exercise library');
  render();
}

async function check_session_on_startup(){
  try{
    const session = await liftanything.get_current_session();
    if(session){
      state.logged_in = true;
      state.user = session;
    }
  } catch(e){
    // no valid session (or hook not implemented yet) — fall through to login
  }
  state.session_checked = true;
  render();
  if(state.logged_in){
    await load_initial_data();
    ensure_feed_filled(state.tab==='mylog' ? 'mylog' : 'motivation');
    ensure_feed_filled(state.tab==='mylog' ? 'motivation' : 'mylog'); // stat row (motivation) + "last time" history (mylog) both needed regardless of active tab
  }
}

function update_keyboard_inset(){
  if(!window.visualViewport) return;
  const vv = window.visualViewport;
  const inset = Math.max(0, window.innerHeight - vv.height);
  document.documentElement.style.setProperty('--keyboard-inset', inset+'px');
  document.documentElement.style.setProperty('--sheet-max-height', Math.max(200, vv.height-40)+'px');
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', update_keyboard_inset);
  window.visualViewport.addEventListener('scroll', update_keyboard_inset);
}

apply_dark_mode();
load_active_session();
render();
check_session_on_startup();
document.getElementById('screen').addEventListener('scroll', handle_feed_scroll);
setInterval(()=>{ if(state.tab==='record' && state.active_session) render(); }, 30000);
</script>
